<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login | Surprise Gifts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #dbeafe, #e0f2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 100, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      color: #000;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
      transform: perspective(800px) rotateX(2deg) rotateY(1.5deg);
      box-shadow: 0 15px 40px rgba(0, 0, 100, 0.2);
    }

    .login-card h3 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
      color: #003366;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
    }

    .input-group-text {
      background-color: rgba(255, 255, 255, 0.5);
      border: none;
      border-radius: 10px 0 0 10px;
      color: #003366;
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.7);
      color: #003366;
      border: none;
      border-radius: 0 10px 10px 0;
    }

    .form-control::placeholder {
      color: #888;
    }

    .form-control:focus {
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 64, 255, 0.3);
      border: none;
    }

    .btn-login {
      background: linear-gradient(135deg, #007bff, #0056b3);
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-weight: bold;
      font-size: 16px;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 64, 255, 0.3);
      transition: 0.3s ease-in-out;
    }

    .btn-login:hover {
      box-shadow: 0 6px 20px rgba(0, 64, 255, 0.5);
      transform: translateY(-2px);
    }

    .alert {
      text-align: center;
      font-size: 14px;
      padding: 8px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h3>Admin Login</h3>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
        <input type="text" name="username" class="form-control" placeholder="Enter Username" required>
      </div>

      <div class="mb-4 input-group">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
      </div>

      <button type="submit" class="btn btn-login w-100">Login</button>
    </form>
  </div>

</body>
</html>
