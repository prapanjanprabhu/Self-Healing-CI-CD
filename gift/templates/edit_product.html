{% extends 'admin_base.html' %}

{% block title %}Edit Product {% endblock %}

{% block extra_css %}

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .form-control:focus {
    outline: none;
    ring: 2px solid #2dd4bf;
    box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.1);
  }
</style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 max-w-3xl">
  <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
    <!-- Header -->
    <div class="bg-blue-600 px-6 py-4 border-b border-gray-200 flex items-center justify-between">
      <h2 class="text-xl font-semibold text-white flex items-center">
        <i class="fas fa-edit text-teal-500 mr-2"></i> Edit Product
      </h2>
      <a href="{% url 'admin_all_products' %}" class="inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors">
        <i class="fas fa-arrow-left mr-2"></i> Back to Products
      </a>
    </div>

    <!-- Form Body -->
    <div class="p-6">
      <form method="POST" class="space-y-6">
        {% csrf_token %}

        <!-- Title Field -->
        <div>
          <label for="title" class="block text-sm font-medium text-gray-700 mb-1">
            <i class="fas fa-heading text-teal-500 mr-1"></i> Product Title
          </label>
          <input type="text" id="title" name="title" value="{{ product.title }}" 
                 class="form-control w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-colors"
                 required>
        </div>

        <!-- Price Field -->
        <div>
          <label for="price" class="block text-sm font-medium text-gray-700 mb-1">
            <i class="fas fa-indian-rupee-sign text-navy-800 mr-1"></i> Price (₹)
          </label>
          <input type="number" id="price" name="price" step="0.01" value="{{ product.price }}"
                 class="form-control w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-colors"
                 required>
        </div>

        <!-- Service Fee Field -->
        <div>
          <label for="service_fee" class="block text-sm font-medium text-gray-700 mb-1">
            <i class="fas fa-hand-holding-heart text-coral-500 mr-1"></i> Service Fee (₹)
          </label>
          <input type="number" id="service_fee" name="service_fee" step="0.01" value="{{ product.service_fee }}"
                 class="form-control w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-colors"
                 required>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end space-x-3 pt-4">
          <button type="submit" class="inline-flex items-center px-4 py-2 bg-teal-500 text-white font-medium rounded-lg hover:bg-teal-600 transition-colors">
            <i class="fas fa-save mr-2"></i> Update Product
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
