<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Admin Dashboard{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS and Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  {% block extra_css %}{% endblock %}

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(120deg, #f0f4ff, #ffffff);
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 220px;
      height: 100vh;
      background: linear-gradient(160deg, #1e3c72, #2a5298);
      color: white;
      padding-top: 2rem;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    .sidebar h2 {
      font-weight: bold;
      margin-bottom: 2rem;
      padding-left: 20px;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      display: block;
      font-weight: 500;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .sidebar a:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(5px);
    }

    .main-content {
      margin-left: 220px;
      padding: 40px;
      background: #f9fbff;
      min-height: 100vh;
      animation: fadeIn 0.5s ease-in-out;
    }

    .toggle-btn {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1100;
      font-size: 24px;
      color: white;
      background: #2a5298;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -100%;
        top: 0;
        width: 250px;
        height: 100%;
        transition: left 0.3s ease;
        padding-top: 1rem;
      }

      .sidebar.active {
        left: 0;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .toggle-btn {
        display: block;
      }
    }
  </style>
</head>
<body>

<!-- Toggle Button (Mobile View) -->
<div class="toggle-btn" id="sidebarToggle">
  <i class="bi bi-list"></i>
</div>

<div class="container-fluid">
  <div class="row">
    
    <!-- Sidebar -->
    <div class="col-md-2 sidebar d-flex flex-column" id="sidebarMenu">
      <h2><i class="bi bi-gift-fill me-2"></i>Wrapzy</h2>

      <a href="{% url 'get_dashboard_context' %}">
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
      </a>
      <a href="{% url 'all_orders_view' %}">
        <i class="bi bi-clock-history me-2"></i> Pending Orders
      </a>
      <a href="{% url 'approved_orders' %}">
        <i class="bi bi-patch-check-fill me-2"></i> Approved Order
      </a>
      <a href="{% url 'edit_front_page' %}">
        <i class="bi bi-pencil-square me-2"></i>Edit Front Page
      </a>
      <a href="{% url 'top_search_manage' %}">
        <i class="bi bi-stars me-2"></i> Top Search
      </a>
      <a href="{% url 'add_product' %}">
        <i class="bi bi-plus-circle me-2"></i> Add Product
      </a>
      <a href="{% url 'admin_all_products' %}">
        <i class="bi bi-cart4 me-2"></i> Edit Products
      </a>
      <a href="{% url 'admin_logout' %}" class="btn btn-outline-danger rounded-pill mt-auto mt-4 mx-3">
        <i class="bi bi-box-arrow-right me-2"></i> Logout
      </a>
    </div>

    <!-- Main Content -->
    <div class="col-md-10 main-content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Toggle Script -->
<script>
  const toggleBtn = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebarMenu');

  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('active');
  });
</script>

</body>
</html>
