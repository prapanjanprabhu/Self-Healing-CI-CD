{% extends 'admin_base.html' %}

{% block title %}Edit front{% endblock %}

{% block extra_css %}
  <style>


    .form-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 700px;
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h2 {
      font-weight: 600;
      margin-bottom: 25px;
      text-align: center;
      color: #333;
    }

    label {
      font-weight: 500;
      color: #555;
    }

    .form-control {
      border-radius: 12px;
      border: 1px solid #ccc;
      transition: all 0.3s;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .form-control:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 0.2rem rgba(108, 99, 255, 0.25);
    }

    .btn-primary {
      background: linear-gradient(to right, #667eea, #764ba2);
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-weight: 500;
      transition: 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      border-radius: 12px;
      padding: 10px 20px;
    }

    .icon-box {
      font-size: 40px;
      color: #764ba2;
      text-align: center;
      margin-bottom: 15px;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }
    
      .main-content {
        margin-left: 0;
        padding: 20px;
      }
    }

    .sidebar h2 {
      font-weight: bold;
      margin-bottom: 2rem;
      padding-left: 20px;
      color:white;
    }
  </style>
  {% endblock %}

  {% block content %}

  <div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="form-card">
  
    <div class="icon-box">
      <i class="bi bi-pencil-square"></i>
    </div>
    <h2>Edit Frontpage</h2>
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Welcome Message</label>
        <input type="text" class="form-control" name="welcome_message" value="{{ content.welcome_message }}">
      </div>

      <div class="mb-3">
        <label class="form-label">About the Company</label>
        <textarea class="form-control" name="about_company" rows="4">{{ content.about_company }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Order Button Text</label>
        <input type="text" class="form-control" name="order_button_text" value="{{ content.order_button_text }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Contact Email</label>
        <input type="email" class="form-control" name="contact_email" value="{{ content.contact_email }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Contact Phone</label>
        <input type="text" class="form-control" name="contact_phone" value="{{ content.contact_phone }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Contact Address</label>
        <textarea class="form-control" name="contact_address" rows="2">{{ content.contact_address }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Unique Tagline</label>
        <input type="text" class="form-control" name="tagline" value="{{ content.tagline }}">
      </div>

      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-primary">💾 Save Changes</button>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">❌ Cancel</a>
      </div>
    </form>
  </div>

  {% endblock %}
